<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#18181b" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#27272a" stroke-width="4">
    <!-- Vertical -->
    <line x1="102" y1="51" x2="102" y2="461" />
    <line x1="153" y1="51" x2="153" y2="461" />
    <line x1="204" y1="51" x2="204" y2="461" />
    <line x1="256" y1="51" x2="256" y2="461" />
    <line x1="307" y1="51" x2="307" y2="461" />
    <line x1="358" y1="51" x2="358" y2="461" />
    <line x1="409" y1="51" x2="409" y2="461" />
    
    <!-- Horizontal -->
    <line x1="51" y1="102" x2="461" y2="102" />
    <line x1="51" y1="153" x2="461" y2="153" />
    <line x1="51" y1="204" x2="461" y2="204" />
    <line x1="51" y1="256" x2="461" y2="256" />
    <line x1="51" y1="307" x2="461" y2="307" />
    <line x1="51" y1="358" x2="461" y2="358" />
    <line x1="51" y1="409" x2="461" y2="409" />
  </g>

  <!-- Cyan Block (Line) -->
  <g transform="translate(102, 307)">
    <rect x="2" y="2" width="47" height="47" rx="8" fill="#06b6d4" />
    <rect x="53" y="2" width="47" height="47" rx="8" fill="#06b6d4" />
    <rect x="104" y="2" width="47" height="47" rx="8" fill="#06b6d4" />
    <rect x="155" y="2" width="47" height="47" rx="8" fill="#06b6d4" />
  </g>

  <!-- Yellow Block (Square) -->
  <g transform="translate(256, 153)">
    <rect x="2" y="2" width="47" height="47" rx="8" fill="#eab308" />
    <rect x="53" y="2" width="47" height="47" rx="8" fill="#eab308" />
    <rect x="2" y="53" width="47" height="47" rx="8" fill="#eab308" />
    <rect x="53" y="53" width="47" height="47" rx="8" fill="#eab308" />
  </g>

  <!-- Purple Block (T-Shape) -->
  <g transform="translate(153, 204)">
    <rect x="53" y="2" width="47" height="47" rx="8" fill="#a855f7" />
    <rect x="2" y="53" width="47" height="47" rx="8" fill="#a855f7" />
    <rect x="53" y="53" width="47" height="47" rx="8" fill="#a855f7" />
    <rect x="104" y="53" width="47" height="47" rx="8" fill="#a855f7" />
  </g>
  
  <!-- Green Block (L-Shape) -->
  <g transform="translate(307, 307)">
    <rect x="2" y="2" width="47" height="47" rx="8" fill="#22c55e" />
    <rect x="2" y="53" width="47" height="47" rx="8" fill="#22c55e" />
    <rect x="53" y="53" width="47" height="47" rx="8" fill="#22c55e" />
    <rect x="104" y="53" width="47" height="47" rx="8" fill="#22c55e" />
  </g>
</svg>
