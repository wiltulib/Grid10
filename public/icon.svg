<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#18181b" />
  
  <!-- Main Container Border -->
  <rect x="40" y="40" width="432" height="432" fill="#222225" stroke="#f4f4f5" stroke-width="8" />

  <!-- Gap = 12, Padding = 24, Cell Size = (432 - 48 - 36) / 4 = 348 / 4 = 87 -->
  
  <g stroke="#3f3f46" stroke-width="2">
    <!-- Row 1 (y=64) -->
    <!-- Col 1 (x=64) -->
    <rect x="64" y="64" width="87" height="87" fill="#f4f4f5" stroke="none" />
    <!-- Col 2 (x=163) -->
    <rect x="163" y="64" width="87" height="87" fill="#f4f4f5" stroke="none" />
    <!-- Col 3 (x=262) -->
    <rect x="262" y="64" width="87" height="87" fill="#FF5A5F" stroke="none" />
    <!-- Col 4 (x=361) -->
    <rect x="361" y="64" width="87" height="87" fill="#18181b" />
    
    <!-- Row 2 (y=163) -->
    <rect x="64" y="163" width="87" height="87" fill="#18181b" />
    <rect x="163" y="163" width="87" height="87" fill="#10B981" stroke="none" />
    <rect x="262" y="163" width="87" height="87" fill="#FF5A5F" stroke="none" />
    <rect x="361" y="163" width="87" height="87" fill="#FF5A5F" stroke="none" />

    <!-- Row 3 (y=262) -->
    <rect x="64" y="262" width="87" height="87" fill="#3B82F6" stroke="none" />
    <rect x="163" y="262" width="87" height="87" fill="#10B981" stroke="none" />
    <rect x="262" y="262" width="87" height="87" fill="#10B981" stroke="none" />
    <rect x="361" y="262" width="87" height="87" fill="#18181b" />

    <!-- Row 4 (y=361) -->
    <rect x="64" y="361" width="87" height="87" fill="#3B82F6" stroke="none" />
    <rect x="163" y="361" width="87" height="87" fill="#3B82F6" stroke="none" />
    <rect x="262" y="361" width="87" height="87" fill="#18181b" />
    <rect x="361" y="361" width="87" height="87" fill="#18181b" />
  </g>
</svg>
